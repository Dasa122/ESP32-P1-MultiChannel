name: Quality Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      SKETCH: .
      FQBN: esp32:esp32:esp32c3
      BUILD_DIR: build
      ARDUINO_DATA_DIR: ~/.arduino15
      ARDUINO_LIB_DIR: ~/Arduino/libraries
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: ${{ runner.os }}-arduino-esp32-3.0.7-libs-v1
          restore-keys: |
            ${{ runner.os }}-arduino-esp32-3.0.7-

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 0.36.0

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7

      - name: Install required libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Async TCP@3.5.0"
          arduino-cli lib install "ESP Async WebServer@3.12.0"
          arduino-cli lib install "NTPClient"
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "Time"

      - name: Compile sketch
        run: |
          mkdir -p "${BUILD_DIR}"
          arduino-cli compile \
            --fqbn "${FQBN}" \
            --build-path "${BUILD_DIR}" \
            --export-binaries \
            --build-property build.partitions=min_spiffs \
            "${SKETCH}"
